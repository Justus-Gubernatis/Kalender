<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender und Panzer</title>
    <link rel="stylesheet" href="kalender_style.css">
</head>
<body>
    <header>
        <h1>Kalender und Panzer</h1>
    </header>

    <main>
        <!-- Kalender buttons -->
        <section class="fenster" id="kalenderBereich">
            <h2>Kalender</h2>

            <div class="navigation">
                <button id="jahrZurück" type="button">←</button>
                <h3 id="jahr">Jahr</h3>
                <button id="jahrVor" type="button">→</button>
            </div>

            <div class="navigation">
                <button id="monatZurück" type="button">←</button>
                <h3 id="monat">Monat</h3>
                <button id="monatVor" type="button">→</button>
            </div>

            <!-- JavaScript für Kalender -->
            <table id="kalender"></table>
        </section>

        <!-- Panzerbereich -->
        <section class="fenster" id="panzerBereich">
            <!-- Panzerbild und info -->
            <section id="panzerBilder">
                <h2>Panzerbilder</h2>
                <div class="panzerNavigation">

                    <button id="panzerZurück" type="button" aria-label="Vorheriger Panzer">←</button>
                    
                    <figure>
                        <img id="panzerBild" alt="Foto des ausgewählten Panzers" hidden>
                        <p id="bildPlatzhalter">Hier erscheint später das Panzerbild.</p>
                        <figcaption id="panzerName">Name des Panzers</figcaption>
                    </figure>
                    
                    <button id="panzerVor" type="button" aria-label="Next Panzer">→</button>
                
                </div>
            </section>

            <!-- Technische Daten des Panzers -->
            <section id="panzerInfo">
                <h2>Technische Daten</h2>
                <dl>
                    <div><dt>Land</dt><dd id="land">-</dd></div>
                    <div><dt>Panzerung Turm (Front / Seite / Heck)</dt><dd id="turmPanzerung">-</dd></div>
                    <div><dt>Panzerung Wanne (Front / Seite / Heck)</dt><dd id="wannenPanzerung">-</dd></div>
                    <div><dt>Geschwindigkeit (max.)</dt><dd id="geschwindigkeit">-</dd></div>
                    <div><dt>Motorleistung</dt><dd id="motorleistung">-</dd></div>
                    <div><dt>Gewicht</dt><dd id="gewicht">-</dd></div>
                    <div><dt>Kaliber</dt><dd id="kaliber">-</dd></div>
                    <div><dt>Baujahr</dt><dd id="baujahr">-</dd></div>
                    <div><dt>Maximale Durchschlagsleistung</dt><dd id="durchschlag">-</dd></div>
                </dl>
            </section>
        </section>
    </main>

    <script src="kalender_script.js" defer></script>
</body>
</html>
